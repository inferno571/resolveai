services:
  # ── Backend Service ───────────────────────────────────────────
  - type: web
    name: resolveai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -e ."
    startCommand: "python -m data.seed_loader && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend Service (Static Site) ────────────────────────────
  - type: web
    name: resolveai-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: resolveai-backend
          property: host
